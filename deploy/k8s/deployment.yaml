apiVersion: apps/v1
kind: Deployment
metadata:
  name: goquest-iim
  namespace: goquest
  labels:
    app: goquest-iim
  annotations:
    argocd-image-updater.argoproj.io/image-list: "app=artifacts.toji.homes/neunexus/goquest-iim:latest"
    argocd-image-updater.argoproj.io/app.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: goquest-iim
  template:
    metadata:
      labels:
        app: goquest-iim
    spec:
      # Reuse the goquest SA (already bound to the Vault `vso` role and created
      # by neunexus deploy/goquest/service). No dedicated SA → no vso-role gap.
      serviceAccountName: goquest
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/work
                    operator: Exists
      imagePullSecrets:
        - name: artifacts-pull-secret
      containers:
        - name: goquest-iim
          image: artifacts.toji.homes/neunexus/goquest-iim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # goquest REST base (in-cluster). MCP server proxies all calls here.
            - name: GOQUEST_API_URL
              value: "http://goquest-service.goquest.svc.cluster.local:8080"
            # Presence of MCP_HTTP_PORT switches the server stdio→StreamableHTTP
            # (src/goquest-mcp-server.ts). Must match containerPort.
            - name: MCP_HTTP_PORT
              value: "8080"
            # goquest API key — same key goquest-service accepts, from Vault
            # secret/neunexus/goquest#api_key via VSO (vso-secrets.yaml).
            - name: GOQUEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: goquest-iim
                  key: api-key
          # StreamableHTTP serves only MCP protocol requests (no /healthz route),
          # so probe the listening socket rather than an HTTP path.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
