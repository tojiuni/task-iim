# Reuses the VaultAuth `default` and ServiceAccount `goquest` already created by
# neunexus deploy/goquest/service (both permitted by the Vault `vso` role) —
# referencing, not co-managing, to avoid an ArgoCD sync fight over duplicates.
# Pulls the goquest API key from Vault (the same secret goquest-service reads)
# and exposes it as k8s Secret `goquest-mcp` key `api-key`, consumed by the
# Deployment's GOQUEST_API_KEY env.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: goquest-mcp
  namespace: goquest
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: neunexus/goquest
  destination:
    name: goquest-mcp
    create: true
    transformation:
      templates:
        api-key:
          text: '{{ get .Secrets "api_key" }}'
  refreshAfter: 1h
