# toji-ci config for goquest-iim (read by toji-ci tekton/tasks/_parse_ci_config.py,
# validated against toji-ci/schema/ci.schema.json). Mirrors ci-repos/gopedia_mcp.yaml.
#   push -> test + build + push  artifacts.toji.homes/neunexus/goquest-iim:{sha,latest}
#   pr   -> test + build only (validation)
# Unlike gopedia-mcp/brain-mcp, goquest-iim's suites are self-contained (fakeFetch
# mocks, no live backend), so they run as the CI gate rather than being skipped.
domain: container
registry: artifacts.toji.homes/neunexus
images:
  - name: goquest-iim
    dockerfile: Dockerfile
    # No include/context globs map source changes to this image, so hybrid
    # change-detection selects [] on push (select_changed_images returns []) and
    # the image froze at the last non-diff build — new commits never rebuilt
    # :latest, so argocd-image-updater had nothing to roll. always_build:true is
    # correct here — same fix as goquest-service/brain/whoami.
    always_build: true
# node:20-alpine auto-selected from the `npm` command prefix.
test:
  run: npm ci && npm run typecheck && npm test && npm run smoke
# Immediately sync the goquest-iim ArgoCD app after a successful build,
# skipping the argocd-image-updater poll cycle (~2-5 min).
sync_apps:
  - goquest-iim
